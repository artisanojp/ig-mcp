services:
  instagram-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: instagram-mcp-server
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MCP_TRANSPORT=streamable-http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # Microsoft Entra ID (Microsoft 365) auth. Set AUTH_ENABLED=false locally to
      # run without auth. When true, the Entra values below are required.
      - AUTH_ENABLED=${AUTH_ENABLED:-true}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_AUDIENCE=${ENTRA_AUDIENCE:-}
      - ENTRA_REQUIRED_ROLE=${ENTRA_REQUIRED_ROLE:-IGMCP.Use}
      - SERVER_PUBLIC_URL=${SERVER_PUBLIC_URL:-http://localhost:8000}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    ports:
      - "8000:8000"
    networks:
      - mcp-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  mcp-network:
    driver: bridge
